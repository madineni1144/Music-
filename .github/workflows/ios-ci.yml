name: iOS CI

# The Linux job runs automatically on pull requests into the iOS development branch.
# The macOS job (real compile of the app target) is manual: Actions > iOS CI > Run workflow.
on:
  workflow_dispatch:
  pull_request:
    branches: [feature/ios-development]
    paths: ['ios/**', '.github/workflows/ios-ci.yml']

permissions:
  contents: read

jobs:
  core-logic-tests:
    name: Core logic tests (Linux)
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: ios/CoreLogic
        run: swift test

  app-build:
    name: App build and tests (macOS)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: ios/CoreLogic
        run: swift test
      - name: Build app for iOS Simulator (unsigned)
        run: >
          xcodebuild -project ios/MadineniMusic.xcodeproj -target MadineniMusic
          -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Run MusicLibrary tests on iOS Simulator
        run: |
          xcrun simctl list devices available | grep -E "iPhone" | head -5
          xcodebuild test -project ios/MadineniMusic.xcodeproj -scheme MadineniMusic \
            -destination "platform=iOS Simulator,name=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+ \(' | head -1 | sed 's/ ($//')" \
            CODE_SIGNING_ALLOWED=NO
      - name: Verify privacy manifest is bundled
        run: |
          APP=$(find ios/build -name MadineniMusic.app -type d | head -1)
          echo "app: $APP"
          test -f "$APP/PrivacyInfo.xcprivacy"
